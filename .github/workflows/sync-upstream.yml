
name: 自动同步上游仓库

on:
  schedule:
    # 每 6 小时自动执行一次（UTC）
    - cron: "23 */6 * * *"

  # 支持在 Actions 页面手动执行
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: 同步最新代码
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 自动获取上游并同步
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 自动识别 Fork 的上游仓库
          PARENT=$(gh api "repos/${GITHUB_REPOSITORY}" \
            --jq '.parent.full_name // empty')

          if [ -z "$PARENT" ]; then
            echo "错误：当前仓库不是 Fork"
            exit 1
          fi

          # 获取上游默认分支
          BRANCH=$(gh api "repos/$PARENT" \
            --jq '.default_branch')

          echo "上游仓库：$PARENT"
          echo "上游分支：$BRANCH"

          # 获取上游最新代码
          git remote add upstream \
            "https://github.com/${PARENT}.git"
          git fetch upstream "$BRANCH"

          # 配置自动提交身份
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # 自动合并，不覆盖自己的提交
          git merge --no-edit FETCH_HEAD

          # 推送至 Fork 默认分支
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "上游同步完成"
